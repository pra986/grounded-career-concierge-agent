[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-career-concierge-agent"
version = "0.1.0"
description = "Function-calling career digital twin with SQLite lead capture, unknown-question logging, Pushover outage resilience, and bounded tool loops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "gradio>=4.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
